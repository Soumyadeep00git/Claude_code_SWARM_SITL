[General]
TcpServerPort = 0
MavlinkDialect = ardupilotmega
ReportStats = false

# CubeOrange+ flight controller (SYSID=1)
[UartEndpoint cubeorange]
Device = /dev/ttyACM0
Baud = 921600

# RFD9000 radio (multipoint mesh)
[UartEndpoint rfd9000]
Device = /dev/ttyTHS1
Baud = 57600

# MAVROS2 (local ROS2 node)
[UdpEndpoint mavros]
Mode = Normal
Address = 127.0.0.1
Port = 14550

# Custom nodes (peer_monitor, rc_relay)
[UdpEndpoint custom]
Mode = Normal
Address = 127.0.0.1
Port = 14551
