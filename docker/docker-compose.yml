version: '3.8'
services:
  drone-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: drone-1
    ports:
    - 5773:5773
    environment:
      DRONE_ID: '1'
      HIERARCHY_PATH: /app/hierarchy.yaml
      GCS_HOST: gcs
    networks:
    - drone_net
    volumes:
    - ../output:/app/output
    stdin_open: true
    tty: true
  drone-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: drone-2
    ports:
    - 5783:5783
    environment:
      DRONE_ID: '2'
      HIERARCHY_PATH: /app/hierarchy.yaml
      GCS_HOST: gcs
    networks:
    - drone_net
    volumes:
    - ../output:/app/output
    stdin_open: true
    tty: true
    depends_on:
    - drone-1
  drone-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: drone-3
    ports:
    - 5793:5793
    environment:
      DRONE_ID: '3'
      HIERARCHY_PATH: /app/hierarchy.yaml
      GCS_HOST: gcs
    networks:
    - drone_net
    volumes:
    - ../output:/app/output
    stdin_open: true
    tty: true
    depends_on:
    - drone-1
  gcs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gcs
    container_name: gcs
    environment:
      HIERARCHY_PATH: /app/hierarchy.yaml
      WEB_PORT: '5000'
    networks:
    - drone_net
    ports:
    - 5000:5000
    stdin_open: true
    tty: true
networks:
  drone_net:
    driver: bridge
