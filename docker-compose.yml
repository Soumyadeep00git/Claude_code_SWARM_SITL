services:
  gcs:
    build: .
    command: ["python3", "-m", "gcs.web_gcs", "--max-drones", "5"]
    network_mode: host
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped

  drone_1:
    build: .
    command: ["python3", "drones/drone_1/run.py"]
    network_mode: host
    volumes:
      - ./logs:/app/logs
    depends_on:
      - gcs
    restart: unless-stopped

  drone_2:
    build: .
    command: ["python3", "drones/drone_2/run.py"]
    network_mode: host
