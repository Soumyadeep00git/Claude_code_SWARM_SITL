peer_monitor:
  ros__parameters:
    peer_sysid: 1
    mavlink_udp_port: 14551
    timeout_s: 5.0

follow_controller:
  ros__parameters:
    # Follow geometry
    offset_north_m: -5.0
    offset_east_m: 3.0
    offset_down_m: 0.0
    control_rate_hz: 10.0

    # 3-mode guidance
    guidance:
      kp: 0.7
      kd: 0.4
      ff_gain: 0.8
      catchup_dist_m: 8.0
      max_catchup_speed: 4.0
      safety_dist_m: 1.0
      escape_speed: 3.0
      max_speed: 3.0
      max_vertical_speed: 1.5
      max_accel: 4.0
      min_altitude_m: 3.0
      critical_altitude_m: 1.5
      deadzone_m: 0.5

failsafe_node:
  ros__parameters:
    hard_radius_m: 1.0
    soft_radius_m: 2.0
    clear_multiplier: 1.5
    escape_speed: 3.0
    max_avoidance_speed: 3.0
    leader_timeout_s: 5.0
    loiter_phase_s: 10.0
    rtl_phase_s: 30.0
    low_battery_pct: 20.0
    tick_rate_hz: 10.0
